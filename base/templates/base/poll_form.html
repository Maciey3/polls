{% extends 'main.html' %}

{% block content %}
    <div class="text-center w-full mt-10">
        <p class="text-5xl font-bold italic">Create Poll</p>
    </div>
    <form method="POST" action="{% if action_id %}{% url action action_id %}{% else %}{% url action %}{% endif %}">
        <div class="grid grid-cols-1 w-1/3 m-auto mt-8 justify-items-center gap-2">
            {% csrf_token %}
            <label for="question" class="font-bold text-xl">Question</label>
            <textarea id="question" name="question" class="py-2 min-h-24 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl overflow-hidden placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0" onload="alert(1)" oninput="this.style.height = ''; this.style.height = this.scrollHeight +'px'">{% if poll %}{{ poll.question.lstrip }}{% endif %}</textarea>
            <label for="description" class="font-bold text-xl">Description</label>
            <textarea id="description" name="description" class="py-2 min-h-24 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl overflow-hidden placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0" onload="this.style.height = ''; this.style.height = this.scrollHeight +'px'" oninput="this.style.height = ''; this.style.height = this.scrollHeight +'px'">{% if poll %}{{ poll.description }}{% endif %}</textarea>
            {% if poll %}
                {% for option in options %}
            	    <label for="vote{{ forloop.counter0|add:"1" }}" class="font-bold text-xl">Option No.{{ forloop.counter0|add:"1" }}</label>
                    <input value="{% if poll %} {{ option.label }} {% endif %}" id="vote{{ forloop.counter0|add:"1" }}" name="options[]" type="text" class="py-2 h-12 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0"/>
                {% endfor %}
            {% else %}
                <label for="vote1" class="font-bold text-xl">Option No.1</label>
                <input id="vote1" name="options[]" type="text" class="py-2 h-12 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0"/>
                <label for="vote2" class="font-bold text-xl">Option No.2</label>
                <input id="vote2" name="options[]" type="text" class="py-2 h-12 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0"/>
            {% endif %}
            <button type="submit" class="mt-4 w-32 m-auto px-2 py-1 border-[3px] border-blue-500 hover:bg-white hover:text-blue-500 text-white bg-blue-500 rounded-xl ease-in duration-100 font-bold">Create</button>
        </div>
    </form>

    <script>
        let textareas = document.querySelectorAll('textarea');
        textareas.forEach((textarea) => {
            textarea.style.height = '';
            textarea.style.height = textarea.scrollHeight +'px'
        })
        console.log(textareas);
    </script>
{% endblock %}
