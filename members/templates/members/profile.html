{% extends 'main.html' %}

{% block content %}
    <form method="POST" action="{% url 'members.profile-update' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="m-auto w-1/3 mt-24 mb-24 grid grid-cols-1 border-2 border-gray-300 shadow-xl p-6 py-16 gap-y-8 rounded-xl justify-items-center">
            {% if user.profile.image %}
                <img class="rounded-full w-56 h-56 border-2 border-gray-300 shadow-xl" src="{{ user.profile.image.url }}" />
            {% else %}
                <i class="text-9xl fa-regular fa-circle-user"></i>
            {% endif %}

            <label class="block">
                <span class="sr-only">Choose profile photo</span>
                <input type="file" name="image" class="block w-full text-sm text-gray-500
                    file:ease-in file:duration-100
                    file:me-4 file:py-2 file:px-4
                    file:outline-0 file:ring-0
                    file:rounded-lg file:border-[3px] file:border-blue-500
                    file:text-sm file:font-semibold
                    file:bg-blue-600 file:text-white
                    hover:file:bg-white hover:file:text-blue-500
                    file:disabled:opacity-50 file:disabled:pointer-events-none
                    dark:text-neutral-500
                    dark:file:bg-blue-500
                    dark:hover:file:bg-blue-400
                ">
            </label>
            <input value="{{ user.username }}" id="username" type="text" name="username" placeholder="Username" class="py-2 h-12 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0"/>
            <textarea value="" placeholder="Your bio" id="bio" name="bio" class="py-2 min-h-24 w-2/3 px-6 border-2 border-gray-300 rounded-xl shadow-xl overflow-hidden placeholder:font-bold focus:ring-blue-500 focus:border-blue-400 focus:shadow-blue-100 focus-visible:ring-0 focus-visible:outline-0" onload="alert(1)" oninput="this.style.height = ''; this.style.height = this.scrollHeight +'px'">{% if user.profile.bio %}{{ user.profile.bio.lstrip }}{% endif %}</textarea>
            <button type="submit" class="block mt-8 m-auto px-4 py-1 border-[3px] border-blue-500 hover:bg-white hover:text-blue-500 text-white bg-blue-500 rounded-xl ease-in duration-100 font-bold">Save</button>
        </div>
    </form>
{% endblock %}
